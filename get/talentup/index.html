<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get TalentUp Class 10 Maths</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://satsuntech.com/talentup/class10-maths/">
  <link rel="icon" href="/favicon.ico">
  <style>
    body { margin: 0; font-family: "Manrope", "Inter", system-ui, sans-serif; background: #fbfdfc; color: #15282c; display: grid; place-items: center; min-height: 100vh; text-align: center; padding: 2rem; }
    img { width: 72px; height: 72px; margin: 0 auto 1rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p { color: #4d6368; margin: 0 0 1.5rem; }
    .links a { display: block; margin: 0.6rem auto; max-width: 320px; padding: 0.9rem 1.2rem; border-radius: 999px; background: #6d28d9; color: #fff; font-weight: 700; text-decoration: none; }
    .links a.alt { background: #fff; color: #15282c; border: 1px solid #c9d8d3; }
  </style>
  <script>
    /* Smart link: sends each visitor to the right store for their device.
       Update APP_STORE_URL once the iOS listing URL is known. */
    (function () {
      var APP_STORE_URL = "https://apps.apple.com/app/talentup-class10-math/id6818162892";
      var PLAY_URL = "https://play.google.com/store/apps/details?id=com.talentup.class10math";
      var WEB_URL = "https://class10math.satsuntech.in";

      var q = window.location.search.replace(/^\?/, "");
      var params = {};
      q.split("&").forEach(function (kv) {
        if (!kv) return;
        var p = kv.split("=");
        params[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || "").replace(/\+/g, " "));
      });
      var utm = q.split("&").filter(function (kv) { return /^utm_/.test(kv); }).join("&");

      var ua = navigator.userAgent || "";
      var isAndroid = /android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var force = params.platform;

      var target;
      if (force === "android" || (!force && isAndroid)) {
        target = PLAY_URL + (utm ? "&referrer=" + encodeURIComponent(utm) : "");
      } else if (force === "ios" || (!force && isIOS)) {
        target = APP_STORE_URL ? APP_STORE_URL + (utm ? "?" + utm : "") : WEB_URL + (utm ? "?" + utm : "");
      } else {
        target = WEB_URL + (utm ? "?" + utm : "");
      }
      window.__target = target;
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <div>
    <img src="/assets/img/brand/satsun-mark.png" alt="">
    <h1>Taking you to TalentUp Class 10 Maths…</h1>
    <p>If nothing happens, choose your device:</p>
    <div class="links">
      <a href="https://play.google.com/store/apps/details?id=com.talentup.class10math">Android — Google Play</a>
      <a href="https://apps.apple.com/app/talentup-class10-math/id6818162892">iPhone — App Store</a>
      <a href="https://class10math.satsuntech.in" class="alt">Laptop — open the web app</a>
    </div>
  </div>
</body>
</html>
